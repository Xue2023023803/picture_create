[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stimulus-figures"
version = "0.1.0"
description = "Configurable dot-stimulus illustrations and experiment procedure figures"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.7,<4"]

[project.scripts]
stimulus-figures = "stimulus_figures.cli:main"

[tool.setuptools.packages.find]
include = ["stimulus_figures*"]
